plugins {
    id 'com.android.application'
}

android {
    namespace 'com.azharul.salimaccounts'
    compileSdk 34

    defaultConfig {
        applicationId 'com.azharul.salimaccounts'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // A fixed debug keystore kept inside the project, so every APK built on
    // GitHub is signed with the same key and installs over the old one.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// No dependencies: the app uses only the Android framework (no external libraries).
